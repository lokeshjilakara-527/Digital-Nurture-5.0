# CI/CD Hands-on — GitHub Actions workflow.
# Place this file at:  .github/workflows/ci.yml  in your repository.
# It builds the Week 5 React app automatically on every push / pull request.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install
        working-directory: week5-react   # folder that holds package.json

      - name: Build
        run: npm run build
        working-directory: week5-react
