<section>
  <h2>Course Listing</h2>

  <p *ngIf="isLoading">Loading courses...</p>

  <div *ngIf="!isLoading">
    <div class="grid" *ngIf="courses.length; else noCourses">
      <app-course-card
        *ngFor="let course of courses; let i = index; trackBy: trackByCourseId"
        [course]="course"
        appHighlight="lightblue"
        (enrollRequested)="onEnroll($event)">
      </app-course-card>
    </div>
    <ng-template #noCourses><p>No courses available.</p></ng-template>
  </div>

  <p *ngIf="selectedCourseId" class="selected">Selected course ID: {{ selectedCourseId }}</p>
</section>
